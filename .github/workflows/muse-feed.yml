name: Validate Muse handoff
on:
  push:
    branches: [main]
    paths:
      - 'muse-feed.json'
      - 'scripts/check-muse-feed.mjs'
      - '.github/workflows/muse-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-muse-feed.mjs
