<script>'use strict';

function showMoodPreview(p,button){const tone=/悲观|卖压|转弱|恐慌/.test(p.mood_label||'')?'negative':/修复|偏多|乐观/.test(p.mood_label||'')?'positive':'neutral';moodPreview.className='week-mood-preview mood-tone-'+tone;moodPreview.innerHTML=`<div class="preview-range">${safe(p.label)} · ${p.status==='archived'?'周五回溯':'进行中'}</div><div class="preview-mood"><span>${safe(p.mood_emoji||'📝')}</span><strong>${safe(p.mood_label||'情绪未记录')}</strong></div><p>${safe(p.mood_reason||'此周尚未记录独立的情绪判断。')}</p><div class="preview-close"><span>QQQ · ${safe(p.qqq_close_date?.slice(5).replace('-','/')||'待核验')} 收盘</span><b>${Number.isFinite(p.qqq_close)?Number(p.qqq_close).toFixed(2):'—'}</b></div>`;moodPreview.hidden=false;const r=button.getBoundingClientRect(),w=moodPreview.offsetWidth;let left=Math.max(10,Math.min(innerWidth-w-10,r.left+r.width/2-w/2));moodPreview.style.left=Math.round(left)+'px';moodPreview.style.top=Math.round(r.bottom+12)+'px'}

function cardIdentity(card){const section=card.parentElement?.closest('[id]')?.id||'page';const record=card.dataset.recordId||card.dataset.eventId;if(record)return section+':'+record;if(card.matches('.x-author-card')){const author=card.querySelector('a[href*="x.com/"],a[href*="twitter.com/"]')?.getAttribute('href')?.split('/')[3]||card.querySelector('strong,b')?.textContent?.trim();return author?'x-author:'+author:null}if(card.matches('.x-topic-card'))return 'x-topic:'+card.querySelector('h3')?.textContent?.trim();const title=card.querySelector('h3,h2')?.textContent?.trim();return title?section+':'+title:null}

function installIncoming(date,src,token,fadeOnly=false){if(token!==requestToken){if(src.startsWith('blob:'))URL.revokeObjectURL(src);return}if(pendingFrame){pendingFrame.remove();if(pendingFrame.dataset.blobURL)URL.revokeObjectURL(pendingFrame.dataset.blobURL)}const next=document.createElement('iframe');next.className='history-frame incoming-frame';next.title=pages.find(p=>p.date===date)?.label||date;next.setAttribute('sandbox',els.frame.getAttribute('sandbox'));next.dataset.requestedWeek=date;if(src.startsWith('blob:'))next.dataset.blobURL=src;pendingFrame=next;next.addEventListener('load',()=>{if(token!==requestToken||pendingFrame!==next)return;try{const url=next.contentWindow.location.href;if(url.startsWith('blob:')?next.dataset.blobURL!==url:next.contentWindow.location.pathname!==weekPath(date))return}catch{return}requestAnimationFrame(async()=>{if(fadeOnly){try{await Promise.race([new Promise(resolve=>{const doc=next.contentDocument,events=doc?.querySelector('#events');if(!events||events.getAttribute('aria-busy')!=='true'){resolve();return}const observer=new MutationObserver(()=>{if(events.getAttribute('aria-busy')!=='true'){observer.disconnect();resolve()}});observer.observe(events,{attributes:true,attributeFilter:['aria-busy']});setTimeout(()=>{observer.disconnect();resolve()},1800)}),new Promise(resolve=>setTimeout(resolve,2000))])}catch{}}if(token!==requestToken)return;const position=pendingReadingPosition;pendingReadingPosition=null;if(position)restoreReadingPosition(position,next);next.dataset.loadedWeek=date;pendingFrame=null;els.loading.hidden=true;animateWeek(els.frame,next,fadeOnly)})},{once:true});next.src=src;els.panel.append(next)}
function selectWeek(date,push=true){const p=pages.find(x=>x.date===date);if(!p||selectedDate===date)return;if(finishTransition)finishTransition();const hadWeek=!!els.frame.dataset.loadedWeek,token=++requestToken;pendingReadingPosition=(hadWeek?captureReadingPosition():null)||pendingReadingPosition;selectedDate=date;if(push)history.replaceState({},'','#week='+date);document.title='美股叙事跟踪 · '+p.label;els.loading.hidden=hadWeek;els.panel.setAttribute('aria-busy','true');els.frame.dataset.requestedWeek=date;els.summary.textContent=p.summary||'';els.meta.textContent=(p.status==='archived'?'已归档 · 内容固化':'进行中 · 北京时间10:00 / 16:00 / 22:00更新')+' · 行情截至 '+p.price_cutoff;renderTabs();if(!hadWeek){els.frame.title=p.label+' · '+(p.status==='archived'?'已归档':'进行中');els.frame.src=weekURL(date);return}loadWeek(date,true).then(html=>{if(token!==requestToken)return;installIncoming(date,URL.createObjectURL(new Blob([weekDocument(html,date)],{type:'text/html'})),token)}).catch(()=>{if(token===requestToken)installIncoming(date,weekURL(date),token)})}
function syncArrows(){const max=els.tabs.scrollWidth-els.tabs.clientWidth;els.prev.disabled=els.tabs.scrollLeft<=1;els.next.disabled=els.tabs.scrollLeft>=max-1}
function renderTabs(){hideMoodPreview();const shown=visiblePages(),existing=[...els.tabs.children];if(existing.length!==shown.length||existing.some((b,i)=>b.dataset.date!==shown[i].date)){els.tabs.replaceChildren();for(const p of shown){const b=document.createElement('button');b.type='button';b.className='week-tab '+(p.status==='archived'?'is-archived':'is-active-week');b.dataset.date=p.date;b.setAttribute('role','tab');b.innerHTML='<span class="week-tab-top"><span class="week-tab-emoji" aria-label="'+safe(p.mood_label||'情绪未记录')+'">'+safe(p.mood_emoji||'📝')+'</span>'+safe(p.label)+(p.status==='active'?' · 进行中':'')+'</span><span class="week-tab-qqq">QQQ '+(Number.isFinite(p.qqq_close)?Number(p.qqq_close).toFixed(2):'—')+'</span>';b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')showMoodPreview(p,b)});b.addEventListener('pointerleave',hideMoodPreview);b.addEventListener('focus',()=>showMoodPreview(p,b));b.addEventListener('blur',hideMoodPreview);b.addEventListener('click',()=>selectWeek(p.date));els.tabs.append(b)}}

function filter(value){month=value;document.querySelectorAll('[data-month]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.month===month)));document.getElementById('mobile-month').value=month;const shown=visiblePages();if(!shown.some(p=>p.date===selectedDate)&&shown.length)selectWeek(shown.at(-1).date);else renderTabs()}
function adjacent(d){els.tabs.scrollBy({left:d*els.tabs.clientWidth*.5,behavior:'smooth'})}
async function start(){try{const r=await fetch('./api/index.json',{cache:'no-store'});if(!r.ok)throw Error('数据暂不可用');currentIndex=await r.json();pages=currentIndex.weeks;const months=[...new Set(pages.map(p=>p.date.slice(5,7)))];const holder=document.querySelector('.month-filter'),select=document.getElementById('mobile-month');holder.replaceChildren();select.replaceChildren();for(const [key,name] of [['all','全部'],...months.map(m=>[m,Number(m)+'月'])]){const b=document.createElement('button');b.type='button';b.dataset.month=key;b.setAttribute('aria-pressed',String(key==='all'));b.textContent=name;b.addEventListener('click',()=>filter(key));holder.append(b);const o=document.createElement('option');o.value=key;o.textContent=name;select.append(o)}select.addEventListener('change',e=>filter(e.target.value));selectWeek(chosenHash()||currentIndex.active_week,false)}catch(e){els.loading.textContent='暂时无法读取本周数据，请稍后刷新。'}}

els.tabs.addEventListener('scroll',()=>{syncArrows();hideMoodPreview();preloadVisibleWeeks()},{passive:true});window.addEventListener('resize',preloadVisibleWeeks);els.prev.setAttribute('aria-label','时间轴向左翻半页');els.next.setAttribute('aria-label','时间轴向右翻半页');

<script>(()=>{const header=document.querySelector('.history-header');if(!header)return;const measure=()=>{const h=header.getBoundingClientRect().height;if(h>0)document.documentElement.style.setProperty('--mobile-header-height',h+'px')};new ResizeObserver(measure).observe(header);measure();})();</script><script>
(()=>{const tabs=document.getElementById('week-tabs');if(!tabs)return;let keepRight=true;

let refreshInFlight=false;
function showRefreshToast(message){

 if(!toast){toast=document.createElement('div');toast.id='refresh-success-toast';toast.setAttribute('role','status');toast.style.cssText='position:fixed;z-index:9999;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;padding:10px 17px;border-radius:22px;background:#263c35;color:white;box-shadow:0 8px 28px #172b2940;font:600 13px system-ui;white-space:nowrap;transition:opacity .22s ease,transform .22s ease';document.body.append(toast)}
 toast.textContent=message;clearTimeout(toast.hideTimer);requestAnimationFrame(()=>{toast.style.opacity='1';toast.style.transform='translate(-50%,0)'});

}
async function refreshCurrentWeek(){
 if(refreshInFlight||!selectedDate)return;refreshInFlight=true;
 if(finishTransition)finishTransition();

 try{
  const [weekResponse,indexResponse]=await Promise.all([fetch(weekURL(date),{cache:'no-store',signal:controller.signal}),fetch(weekURL(date).includes('/weeks/')?'./api/index.json':'/api/index',{cache:'no-store',signal:controller.signal})]);

  if(token!==requestToken)return;

 }finally{clearTimeout(timeout);refreshInFlight=false;oldFrame.contentWindow?.postMessage({type:'dashboard-refresh-finished'},location.origin);window.postMessage({type:'dashboard-refresh-finished'},location.origin)}
}

</script><script>
(()=>{

   wrap.style.maxWidth='none';wrap.style.width=rect.width+'px';wrap.style.marginLeft=(frameRect.left+rect.left)+'px';wrap.style.marginRight='0';wrap.style.paddingLeft=style.paddingLeft;wrap.style.paddingRight=style.paddingRight;
