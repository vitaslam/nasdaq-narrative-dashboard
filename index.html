<title>美股叙事跟踪</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#233044;background:#f7f8fc;font-synthesis:none;--line:#e4eaf2;--muted:#748398;--accent:#6079bd}
*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #829ad1;outline-offset:3px}button:disabled{cursor:default;opacity:.35}.history-header{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 15px #31456705;position:relative;z-index:1}.history-wrap{max-width:1320px;margin:auto;padding:15px 26px 12px}.history-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.history-title{display:flex;align-items:center;gap:10px;min-width:0}.history-mark{height:28px;width:28px;flex:0 0 28px;display:grid;place-items:center;background:#f0edfa;border-radius:8px;color:#8880b6}.history-title h1{font-size:15px;font-weight:650;margin:0;letter-spacing:.2px}.history-title p{margin:2px 0 0;color:var(--muted);font-size:11px}.history-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.history-button{background:white;border:1px solid var(--line);border-radius:7px;color:#53647c;padding:6px 10px;font-size:11px;white-space:nowrap}.history-button:hover{background:#f5f7fb}.history-button.primary{color:#5d6eaa;background:#f3f5fc;border-color:#dce3f4}.history-controls{margin-top:13px;display:flex;align-items:center;gap:12px}.month-filter{display:flex;flex-shrink:0;gap:2px;background:#f5f7fb;border:1px solid #e8edf4;border-radius:7px;padding:3px}.month-filter button{border:0;background:transparent;font-size:11px;padding:5px 10px;border-radius:5px;color:#7b879a;white-space:nowrap}.month-filter button[aria-pressed=true]{background:white;box-shadow:0 1px 5px #293f6010;color:#4f659f;font-weight:600}.week-control{display:flex;align-items:center;gap:6px;flex:1;min-width:0}.week-arrow{width:28px;height:31px;padding:0;flex-shrink:0;border:1px solid var(--line);border-radius:6px;background:white;color:#7a8ba6;font-size:17px}.week-arrow:not(:disabled):hover{background:#f0f4fb}.week-tabs{display:flex;align-items:center;gap:5px;overflow:auto;scrollbar-width:thin;scrollbar-color:#d5ddeb transparent;padding:2px 1px 5px;flex:1;min-width:0;scroll-behavior:smooth}.week-tab{border:1px solid #e5eaf3;border-radius:7px;background:#fff;color:#7b889c;padding:6px 10px;font-size:11px;line-height:1.45;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}.week-tab[aria-selected=true]{background:#edf2fc;border-color:#a9badd;color:#4e66a3;font-weight:650;box-shadow:0 1px 3px #3f609b0a}.week-tab:hover{border-color:#a9badd}.history-bottom{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-top:8px;font-size:11px;color:#7c899b;line-height:1.6}.history-change{display:flex;align-items:flex-start;gap:9px;min-width:0}.change-label{border-radius:20px;background:#edf5f3;color:#6c9b8e;font-size:10px;font-weight:550;white-space:nowrap;line-height:1.5;padding:2px 7px;flex-shrink:0}.history-summary{color:#62738d;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.history-meta{font-size:10px;white-space:nowrap;color:#929eb0;text-align:right;font-variant-numeric:tabular-nums}.history-panel{min-width:0;min-height:0;height:100%;position:relative;background:#f7f8fc}.history-frame{width:100%;height:100%;border:0;display:block;background:#f7f8fc}.history-status{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#8795aa;background:#f7f8fc;pointer-events:none}.history-status[hidden]{display:none}.history-error{margin:30px;padding:20px;border:1px solid var(--line);border-radius:10px;background:white;color:#7d6c57}.history-toast{position:fixed;left:50%;bottom:23px;transform:translateX(-50%);background:#263b53;color:#fff;font-size:12px;padding:10px 16px;border-radius:7px;box-shadow:0 6px 25px #243b5325;z-index:5;max-width:90%;text-align:center}.history-toast[hidden]{display:none}
@media(max-width:880px){.history-wrap{padding:13px 18px 11px}.history-top{gap:12px}.history-controls{gap:9px}.history-meta{font-size:9px}.week-tab{padding:6px 9px}}
@media(max-width:560px){.history-wrap{padding:12px 12px 10px}.history-top{align-items:flex-start;gap:8px}.history-title{gap:7px}.history-title h1{font-size:13px}.history-title p{font-size:10px;max-width:165px}.history-mark{height:25px;width:25px;flex-basis:25px}.history-actions{gap:4px;max-width:153px}.history-button{font-size:10px;padding:5px 7px}.history-controls{display:block;margin-top:10px}.month-filter{width:max-content;padding:2px;margin-bottom:8px}.month-filter button{padding:4px 11px;font-size:11px}.week-control{gap:4px}.week-arrow{height:32px;width:27px}.week-tabs{gap:4px;padding-bottom:4px}.week-tab{font-size:11px;padding:5px 8px}.history-bottom{gap:6px;margin-top:6px;display:block}.history-summary{font-size:11px}.history-meta{font-size:9px;margin-top:4px;text-align:left;padding-left:62px}.change-label{font-size:9px}.history-change{gap:7px}}
@media print{body{height:auto;overflow:visible;display:block}.history-controls,.history-actions,.history-bottom,.history-status{display:none}.history-header{box-shadow:none}.history-panel{height:auto}.history-frame{height:1100px}}

.mobile-month{display:none}
body{grid-template-columns:minmax(0,1fr)}.history-header,.history-wrap,.history-controls,.history-top{min-width:0;max-width:100%}.history-header{width:100%}
@media(max-width:800px){
 body{height:100vh;height:100dvh;min-width:0;-webkit-text-size-adjust:100%}
 .history-wrap{padding:10px max(12px,env(safe-area-inset-right)) 9px max(12px,env(safe-area-inset-left))}
 .history-top{align-items:center;gap:8px}.history-title h1{font-size:14px}.history-title p,.history-mark{display:none}
 .history-actions{max-width:none;flex-wrap:nowrap;gap:5px}.history-button{font-size:11px;min-height:40px;padding:8px}
 .history-controls{display:flex;margin-top:6px;gap:7px}.month-filter{display:none}
 .mobile-month{display:block;width:75px;min-height:44px;flex:0 0 75px;border:1px solid var(--line);border-radius:7px;background:#f5f7fb;color:#536b9f;font-size:16px;padding:6px}
 .week-control{gap:3px}.week-arrow{width:36px;min-height:44px;height:44px;font-size:20px}.week-tabs{gap:5px;padding-bottom:0}.week-tab{min-height:44px;padding:9px;font-size:12px}
 .history-bottom{display:block;margin-top:7px}.history-meta{display:none}.history-summary{font-size:12px;line-height:1.6;-webkit-line-clamp:2}.change-label{font-size:10px;padding:3px 6px}
 .history-panel,.history-frame{min-width:0;width:100%}.history-frame{-webkit-overflow-scrolling:touch}.history-toast{bottom:max(16px,env(safe-area-inset-bottom))}
}
</style>
<style id="review-shell-css">
    .history-wrap{max-width:1440px;padding:13px 28px 10px}.history-top{gap:24px;align-items:center}.history-title{flex-shrink:0;gap:8px}.history-title h1{font-size:17px;white-space:nowrap}.review-brand-mark{color:#6d69bd;font-size:26px}.preview-pill{color:#7d769d;background:#f1eff8;border-radius:5px;padding:3px 6px;font-size:9px;white-space:nowrap}.history-controls{margin:0;min-width:0;flex:1;gap:8px}.month-filter button{padding:5px 8px}.week-tab{font-size:10px;padding:6px 8px}.week-tabs{padding-bottom:2px}.compare-original{font-size:10px;color:#8590a3;text-decoration:none;white-space:nowrap}.history-bottom{margin-top:8px;padding-left:0}.history-summary{font-size:10px}.history-meta{font-size:9px}
    @media(max-width:1100px){.history-top{flex-wrap:wrap;gap:9px 16px}.history-controls{order:3;flex-basis:100%}.compare-original{margin-left:auto}.history-title h1{font-size:16px}}
    @media(max-width:800px){.history-wrap{padding:8px 14px}.history-controls{display:flex;margin:0}.history-top{align-items:center}.history-title h1{display:block}.history-bottom{display:none}.preview-pill{font-size:9px}.week-tab{min-height:34px}.history-title{gap:7px}.review-brand-mark{font-size:22px}.compare-original{font-size:10px}}
    </style><style>.history-wrap{max-width:1440px}.week-tab.is-active-week{border-color:#b7cfc8}.schedule-info{font-size:10px;color:#8b98aa;margin:4px 0 0}.week-tab.is-archived{background:#fafbfd}</style></head>
<body>
<header class="history-header">
 <div class="history-wrap">
  <div class="history-top">
   <div class="history-title"><span class="review-brand-mark">◈</span><h1>美股叙事跟踪</h1></div>
   <div class="history-controls">
   <div class="month-filter" role="group" aria-label="筛选月份"><button type="button" data-month="all" aria-pressed="true">全部</button><button type="button" data-month="09" aria-pressed="false">9 月</button><button type="button" data-month="10" aria-pressed="false">10 月</button></div>
   <select class="mobile-month" id="mobile-month" aria-label="选择月份"><option value="all">全部</option><option value="09">9月</option><option value="10">10月</option></select><div class="week-control"><button type="button" class="week-arrow" id="previous-week" aria-label="上一周" title="上一周">‹</button><div class="week-tabs" id="week-tabs" role="tablist" aria-label="选择每周收盘快照"></div><button type="button" class="week-arrow" id="next-week" aria-label="下一周" title="下一周">›</button></div>
  </div>
  </div>
  <div class="history-bottom"><div class="history-change"><span class="change-label">本周变化</span><div class="history-summary" id="week-summary" aria-live="polite"></div></div><div class="history-meta" id="week-meta"></div></div>
 </div>
</header>
<main class="history-panel" role="tabpanel" id="weekly-panel" aria-label="选定周的完整 Dashboard"><div class="history-status" id="loading-status" role="status">正在加载所选周…</div><iframe class="history-frame" id="history-frame" title="所选周的完整 Dashboard" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals"></iframe></main>
<div class="history-toast" id="history-toast" role="status" hidden></div>
<script>'use strict';
const els={tabs:document.getElementById('week-tabs'),frame:document.getElementById('history-frame'),panel:document.getElementById('weekly-panel'),summary:document.getElementById('week-summary'),meta:document.getElementById('week-meta'),prev:document.getElementById('previous-week'),next:document.getElementById('next-week'),loading:document.getElementById('loading-status')};
let pages=[],selectedDate='',month='all',currentIndex=null;
function visiblePages(){return pages.filter(p=>month==='all'||p.date.slice(5,7)===month)}
function chosenHash(){const m=location.hash.match(/^#(?:week=)?(\d{4}-\d{2}-\d{2})$/);return m&&pages.some(p=>p.date===m[1])?m[1]:null}
function selectWeek(date,push=true){const p=pages.find(x=>x.date===date);if(!p)return;selectedDate=date;if(push)history.replaceState({},'','#week='+date);document.title='美股叙事跟踪 · '+p.label;els.loading.hidden=false;els.frame.src='./weeks/'+date+'.html';els.frame.title=p.label+' · '+(p.status==='archived'?'已归档':'进行中');els.summary.textContent=p.summary||'';els.meta.textContent=(p.status==='archived'?'已归档 · 内容固化':'进行中 · 北京时间10:00 / 16:00 / 22:00更新')+' · 行情截至 '+p.price_cutoff;renderTabs()}
function renderTabs(){const shown=visiblePages();els.tabs.replaceChildren();for(const p of shown){const b=document.createElement('button');b.type='button';b.className='week-tab '+(p.status==='archived'?'is-archived':'is-active-week');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(p.date===selectedDate));b.textContent=p.label+(p.status==='active'?' · 进行中':'');b.addEventListener('click',()=>selectWeek(p.date));els.tabs.append(b);if(p.date===selectedDate)b.scrollIntoView({block:'nearest',inline:'nearest'})}const i=shown.findIndex(p=>p.date===selectedDate);els.prev.disabled=i<=0;els.next.disabled=i<0||i>=shown.length-1}
function filter(value){month=value;document.querySelectorAll('[data-month]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.month===month)));document.getElementById('mobile-month').value=month;const shown=visiblePages();if(!shown.some(p=>p.date===selectedDate)&&shown.length)selectWeek(shown.at(-1).date);else renderTabs()}
function adjacent(d){const shown=visiblePages(),i=shown.findIndex(p=>p.date===selectedDate);if(shown[i+d])selectWeek(shown[i+d].date)}
async function start(){try{const r=await fetch('./api/index.json',{cache:'no-store'});if(!r.ok)throw Error('数据暂不可用');currentIndex=await r.json();pages=currentIndex.weeks;const months=[...new Set(pages.map(p=>p.date.slice(5,7)))];const holder=document.querySelector('.month-filter'),select=document.getElementById('mobile-month');holder.replaceChildren();select.replaceChildren();for(const [key,name] of [['all','全部'],...months.map(m=>[m,Number(m)+'月'])]){const b=document.createElement('button');b.type='button';b.dataset.month=key;b.setAttribute('aria-pressed',String(key==='all'));b.textContent=name;b.addEventListener('click',()=>filter(key));holder.append(b);const o=document.createElement('option');o.value=key;o.textContent=name;select.append(o)}select.addEventListener('change',e=>filter(e.target.value));selectWeek(chosenHash()||currentIndex.active_week,false)}catch(e){els.loading.textContent='暂时无法读取本周数据，请稍后刷新。'}}
els.prev.addEventListener('click',()=>adjacent(-1));els.next.addEventListener('click',()=>adjacent(1));els.frame.addEventListener('load',()=>els.loading.hidden=true);window.addEventListener('hashchange',()=>{const d=chosenHash();if(d&&d!==selectedDate)selectWeek(d,false)});start();
</script>
</body>
</html>
