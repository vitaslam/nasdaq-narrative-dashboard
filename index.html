<script>'use strict';
const els={tabs:document.getElementById('week-tabs'),frame:document.getElementById('history-frame'),panel:document.getElementById('weekly-panel'),summary:document.getElementById('week-summary'),meta:document.getElementById('week-meta'),prev:document.getElementById('previous-week'),next:document.getElementById('next-week'),loading:document.getElementById('loading-status')};
let pages=[],selectedDate='',month='all',currentIndex=null,pendingReadingPosition=null,requestToken=0,preloadTimer,finishTransition=null,pendingFrame=null;

const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hideMoodPreview(){moodPreview.hidden=true}
function showMoodPreview(p,button){const tone=/悲观|卖压|转弱|恐慌/.test(p.mood_label||'')?'negative':/修复|偏多|乐观/.test(p.mood_label||'')?'positive':'neutral';moodPreview.className='week-mood-preview mood-tone-'+tone;moodPreview.innerHTML=`<div class="preview-range">${safe(p.label)} · ${p.status==='archived'?'周五回溯':'进行中'}</div><div class="preview-mood"><span>${safe(p.mood_emoji||'📝')}</span><strong>${safe(p.mood_label||'情绪未记录')}</strong></div><p>${safe(p.mood_reason||'此周尚未记录独立的情绪判断。')}</p><div class="preview-close"><span>QQQ · ${safe(p.qqq_close_date?.slice(5).replace('-','/')||'待核验')} 收盘</span><b>${Number.isFinite(p.qqq_close)?Number(p.qqq_close).toFixed(2):'—'}</b></div>`;moodPreview.hidden=false;const r=button.getBoundingClientRect(),w=moodPreview.offsetWidth;let left=Math.max(10,Math.min(innerWidth-w-10,r.left+r.width/2-w/2));moodPreview.style.left=Math.round(left)+'px';moodPreview.style.top=Math.round(r.bottom+12)+'px'}

const weekURL=date=>'./weeks/'+date+'.html?v=71';

function pumpPreload(){while(preloadRunning<3&&preloadQueue.length){const job=preloadQueue.shift();preloadRunning++;fetch(weekURL(job.date),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Week unavailable');return r.text()}).then(html=>{weekCache.set(job.date,{html,at:Date.now()});job.resolve(html)},job.reject).finally(()=>{preloadRunning--;weekPending.delete(job.date);pumpPreload()})}}

function preloadVisibleWeeks(){clearTimeout(preloadTimer);preloadTimer=setTimeout(()=>{const view=els.tabs.getBoundingClientRect();for(const button of els.tabs.children){const box=button.getBoundingClientRect();if(box.right>view.left&&box.left<view.right&&button.dataset.date!==selectedDate)loadWeek(button.dataset.date).catch(()=>{})}},180)}
function weekDocument(html,date){const base=new URL(weekURL(date),location.href).href;return html.replace(/<head>/i,'<head><base href="'+base+'">')}
// Match the heading the reader is looking at, then align that same heading in

const readingAnchors=['#overview h1','.market-overview','#verification .section-head h2','.dashboard-chart-heading h2','#price-title','#narrative .section-head h2','#x-frequent-title','#calendar .section-head h2','#method summary'];
const readingFallback={'#x-frequent-title':'#narrative .section-head h2','#price-title':'.dashboard-chart-heading h2'};

function restoreReadingPosition(position,frame=els.frame){try{const doc=frame.contentDocument,scroll=doc?.scrollingElement,anchor=doc?.querySelector(position.key)||doc?.querySelector(readingFallback[position.key])||doc?.querySelector('#overview h1');if(!scroll||!anchor)return;const top=scroll.scrollTop+anchor.getBoundingClientRect().top-position.top;scroll.scrollTo({top:Math.max(0,top),behavior:'instant'})}catch{/* A failed position read must not block week navigation. */}}

function cardIdentity(card){const section=card.parentElement?.closest('[id]')?.id||'page';const record=card.dataset.recordId||card.dataset.eventId;if(record)return section+':'+record;if(card.matches('.x-author-card')){const author=card.querySelector('a[href*="x.com/"],a[href*="twitter.com/"]')?.getAttribute('href')?.split('/')[3]||card.querySelector('strong,b')?.textContent?.trim();return author?'x-author:'+author:null}if(card.matches('.x-topic-card'))return 'x-topic:'+card.querySelector('h3')?.textContent?.trim();const title=card.querySelector('h3,h2')?.textContent?.trim();return title?section+':'+title:null}
function visibleCards(frame){try{const doc=frame.contentDocument,seen=new Set(),cards=new Map();for(const card of doc.querySelectorAll('.card')){const rect=card.getBoundingClientRect(),key=cardIdentity(card);if(!key||seen.has(key)||rect.bottom<0||rect.top>frame.clientHeight||!card.getClientRects().length)continue;seen.add(key);cards.set(key,{card,rect})}return cards}catch{return new Map()}}
function animateWeek(oldFrame,newFrame){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,duration=reduce?0:190;const oldCards=visibleCards(oldFrame),newCards=visibleCards(newFrame);let ended=false;const done=()=>{if(ended)return;ended=true;oldFrame.remove();if(oldFrame.dataset.blobURL)URL.revokeObjectURL(oldFrame.dataset.blobURL);newFrame.classList.remove('incoming-frame');newFrame.style.opacity='';newFrame.id='history-frame';els.frame=newFrame;els.panel.removeAttribute('aria-busy');finishTransition=null};finishTransition=done;oldFrame.id='';newFrame.style.opacity='1';if(!duration){done();return}oldFrame.style.pointerEvents='none';newFrame.animate([{opacity:0},{opacity:1}],{duration,easing:'ease-out'});oldFrame.animate([{opacity:1},{opacity:0}],{duration,easing:'ease-out'});for(const [key,{card,rect}] of newCards){const former=oldCards.get(key),dx=former?Math.max(-220,Math.min(220,former.rect.left-rect.left)):0,dy=former?Math.max(-220,Math.min(220,former.rect.top-rect.top)):12;card.animate([{opacity:0,transform:`translate(${dx}px,${dy}px)`},{opacity:1,transform:'translate(0,0)'}],{duration,easing:'cubic-bezier(.2,.75,.25,1)'})}for(const [key,{card}] of oldCards)if(!newCards.has(key))card.animate([{opacity:1},{opacity:0}],{duration:duration*.8,easing:'ease-out'});setTimeout(done,duration+20)}
function installIncoming(date,src,token){if(token!==requestToken){if(src.startsWith('blob:'))URL.revokeObjectURL(src);return}if(pendingFrame){pendingFrame.remove();if(pendingFrame.dataset.blobURL)URL.revokeObjectURL(pendingFrame.dataset.blobURL)}const next=document.createElement('iframe');next.className='history-frame incoming-frame';next.title=pages.find(p=>p.date===date)?.label||date;next.setAttribute('sandbox',els.frame.getAttribute('sandbox'));next.dataset.requestedWeek=date;if(src.startsWith('blob:'))next.dataset.blobURL=src;pendingFrame=next;next.addEventListener('load',()=>{if(token!==requestToken||pendingFrame!==next)return;try{const url=next.contentWindow.location.href;if(url.startsWith('blob:')?next.dataset.blobURL!==url:next.contentWindow.location.pathname!==weekPath(date))return}catch{return}requestAnimationFrame(()=>{if(token!==requestToken)return;const position=pendingReadingPosition;pendingReadingPosition=null;if(position)restoreReadingPosition(position,next);next.dataset.loadedWeek=date;pendingFrame=null;els.loading.hidden=true;animateWeek(els.frame,next)})},{once:true});next.src=src;els.panel.append(next)}
function selectWeek(date,push=true){const p=pages.find(x=>x.date===date);if(!p||selectedDate===date)return;if(finishTransition)finishTransition();const hadWeek=!!els.frame.dataset.loadedWeek,token=++requestToken;pendingReadingPosition=(hadWeek?captureReadingPosition():null)||pendingReadingPosition;selectedDate=date;if(push)history.replaceState({},'','#week='+date);document.title='美股叙事跟踪 · '+p.label;els.loading.hidden=hadWeek;els.panel.setAttribute('aria-busy','true');els.frame.dataset.requestedWeek=date;els.summary.textContent=p.summary||'';els.meta.textContent=(p.status==='archived'?'已归档 · 内容固化':'进行中 · 北京时间10:00 / 16:00 / 22:00更新')+' · 行情截至 '+p.price_cutoff;renderTabs();if(!hadWeek){els.frame.title=p.label+' · '+(p.status==='archived'?'已归档':'进行中');els.frame.src=weekURL(date);return}loadWeek(date,true).then(html=>{if(token!==requestToken)return;installIncoming(date,URL.createObjectURL(new Blob([weekDocument(html,date)],{type:'text/html'})),token)}).catch(()=>{if(token===requestToken)installIncoming(date,weekURL(date),token)})}
function syncArrows(){const max=els.tabs.scrollWidth-els.tabs.clientWidth;els.prev.disabled=els.tabs.scrollLeft<=1;els.next.disabled=els.tabs.scrollLeft>=max-1}
function renderTabs(){hideMoodPreview();const shown=visiblePages(),existing=[...els.tabs.children];if(existing.length!==shown.length||existing.some((b,i)=>b.dataset.date!==shown[i].date)){els.tabs.replaceChildren();for(const p of shown){const b=document.createElement('button');b.type='button';b.className='week-tab '+(p.status==='archived'?'is-archived':'is-active-week');b.dataset.date=p.date;b.setAttribute('role','tab');b.innerHTML='<span class="week-tab-top"><span class="week-tab-emoji" aria-label="'+safe(p.mood_label||'情绪未记录')+'">'+safe(p.mood_emoji||'📝')+'</span>'+safe(p.label)+(p.status==='active'?' · 进行中':'')+'</span><span class="week-tab-qqq">QQQ '+(Number.isFinite(p.qqq_close)?Number(p.qqq_close).toFixed(2):'—')+'</span>';b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')showMoodPreview(p,b)});b.addEventListener('pointerleave',hideMoodPreview);b.addEventListener('focus',()=>showMoodPreview(p,b));b.addEventListener('blur',hideMoodPreview);b.addEventListener('click',()=>selectWeek(p.date));els.tabs.append(b)}}
 const buttons=[...els.tabs.children];buttons.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.date===selectedDate)));
 const selected=buttons.find(b=>b.dataset.date===selectedDate);if(selected){const view=els.tabs.getBoundingClientRect(),card=selected.getBoundingClientRect(),center=card.left+card.width/2,min=view.left+view.width*.3,max=view.right-view.width*.3;if(center<min||center>max)els.tabs.scrollBy({left:center-(center<min?min:max),behavior:'smooth'})}
 requestAnimationFrame(syncArrows);preloadVisibleWeeks()}
function filter(value){month=value;document.querySelectorAll('[data-month]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.month===month)));document.getElementById('mobile-month').value=month;const shown=visiblePages();if(!shown.some(p=>p.date===selectedDate)&&shown.length)selectWeek(shown.at(-1).date);else renderTabs()}
function adjacent(d){els.tabs.scrollBy({left:d*els.tabs.clientWidth*.5,behavior:'smooth'})}
async function start(){try{const r=await fetch('./api/index.json',{cache:'no-store'});if(!r.ok)throw Error('数据暂不可用');currentIndex=await r.json();pages=currentIndex.weeks;const months=[...new Set(pages.map(p=>p.date.slice(5,7)))];const holder=document.querySelector('.month-filter'),select=document.getElementById('mobile-month');holder.replaceChildren();select.replaceChildren();for(const [key,name] of [['all','全部'],...months.map(m=>[m,Number(m)+'月'])]){const b=document.createElement('button');b.type='button';b.dataset.month=key;b.setAttribute('aria-pressed',String(key==='all'));b.textContent=name;b.addEventListener('click',()=>filter(key));holder.append(b);const o=document.createElement('option');o.value=key;o.textContent=name;select.append(o)}select.addEventListener('change',e=>filter(e.target.value));selectWeek(chosenHash()||currentIndex.active_week,false)}catch(e){els.loading.textContent='暂时无法读取本周数据，请稍后刷新。'}}
els.prev.addEventListener('click',()=>adjacent(-1));els.next.addEventListener('click',()=>adjacent(1));
els.tabs.addEventListener('scroll',()=>{syncArrows();hideMoodPreview();preloadVisibleWeeks()},{passive:true});window.addEventListener('resize',preloadVisibleWeeks);els.prev.setAttribute('aria-label','时间轴向左翻半页');els.next.setAttribute('aria-label','时间轴向右翻半页');
els.frame.addEventListener('load',()=>{try{if(els.frame.contentWindow.location.pathname!==weekPath(els.frame.dataset.requestedWeek))return}catch{return}els.frame.dataset.loadedWeek=selectedDate;els.loading.hidden=true;els.panel.removeAttribute('aria-busy')});window.addEventListener('hashchange',()=>{const d=chosenHash();if(d&&d!==selectedDate)selectWeek(d,false)});window.addEventListener('message',e=>{if(e.source!==els.frame.contentWindow||e.origin!==location.origin||e.data?.type!=='nasdaq:select-week')return;if(pages.some(p=>p.date===e.data.date))selectWeek(e.data.date)});start();
</script>
